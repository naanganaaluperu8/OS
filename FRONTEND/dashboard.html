<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Experiment Explorer</title>
  <link rel="stylesheet" href="./dashboard.css" />
</head>
<body>
  <main class="page">
    <header class="top">
      <div>
        <h1>Experiment Explorer</h1>
        <p class="sub">Modern code browser for OS lab folders</p>
      </div>
      <div class="top-actions">
        <button id="themeBtn" class="ghost-btn" type="button">light</button>
        <a href="./index.html" class="back-link">Back to Terminal</a>
      </div>
    </header>

    <section class="toolbar">
      <nav id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb"></nav>
      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="Search experiments/files" aria-label="Search" />
      </div>
    </section>

    <section id="status" class="status">Loading explorer...</section>

    <section id="expGrid" class="exp-grid" aria-label="Experiments"></section>
    <section id="allFilesPanel" class="all-files-panel">
      <div class="panel-head">
        <h2>All Files</h2>
        <span id="allFilesMeta" class="meta">0 files</span>
      </div>
      <section id="allFilesList" class="explorer-list" aria-label="All files"></section>
    </section>
    <section id="explorerList" class="explorer-list hidden" aria-label="Folder contents"></section>

    <section id="viewer" class="viewer hidden" aria-label="Code viewer">
      <article class="card">
        <div class="card-head">
          <div>
            <div id="mainTitle" class="file-name">File</div>
            <div id="fileMeta" class="meta"></div>
          </div>
          <div class="head-actions">
            <button id="mainCopyBtn" class="copy-btn" type="button">Copy</button>
            <button id="downloadBtn" class="copy-btn" type="button">Download</button>
          </div>
        </div>
        <pre id="mainCode" class="code"></pre>
      </article>
    </section>
  </main>
  <script src="./dashboard.js" type="module"></script>
</body>
</html>
