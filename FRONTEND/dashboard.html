<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OS Code Dashboard</title>
  <link rel="stylesheet" href="./dashboard.css" />
</head>
<body>
  <main class="page">
    <header class="top">
      <h1>OS Explorer</h1>
      <a href="./index.html" class="back-link">Back to Terminal</a>
    </header>

    <section id="expGrid" class="exp-grid" aria-label="Folder boxes"></section>

    <section id="viewer" class="viewer hidden">
      <article class="card">
        <div class="card-head">
          <div id="mainTitle" class="file-name">File</div>
          <button id="mainCopyBtn" class="copy-btn" type="button">Copy</button>
        </div>
        <pre id="mainCode" class="code reader"></pre>
      </article>

      <article id="pkgCard" class="card hidden">
        <div class="card-head">
          <div class="file-name">Items</div>
          <button id="pkgCopyBtn" class="copy-btn" type="button">Copy</button>
        </div>
        <pre id="pkgCode" class="code"></pre>
      </article>
    </section>

    <p id="note" class="note">Type Hello in terminal to open this dashboard.</p>
  </main>
  <script src="./dashboard.js" type="module"></script>
</body>
</html>
